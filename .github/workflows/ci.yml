name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.14 es la version minima documentada en el README
        python-version: ["3.14"]

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Comprobar la sintaxis de todos los .py
        run: python -m compileall -q ejercicios main.py

      - name: Ejecutar las soluciones comentadas
        run: python ejercicios/verificar_soluciones.py

      - name: Avisar si los ejercicios dejan archivos sin ignorar
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Los ejercicios dejan archivos sin ignorar:"
            git status --porcelain
          fi